name: Reproducible Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow (release.yml) reuses these jobs for an rN tag.
  workflow_call:

# Two independent jobs build the same commit per architecture; a third job
# compares the bytes and fails on any difference. No signing and no secret:
# the signed release is the maintainer's job, outside the CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-a:
    name: Build A linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # setup-go reads only the go directive, not the toolchain line; build.sh
      # pins GOTOOLCHAIN=local and refuses any other version, so the exact
      # toolchain is derived here from go.mod (setup-go wants the bare
      # version, without the go prefix) — still the single Go source.
      - name: Go toolchain from go.mod
        run: echo "GO_TOOLCHAIN=$(sed -n 's/^toolchain go//p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
      # build.sh is offline (GOPROXY=off) and needs the modules already in the cache; a fresh runner has none.
      # Fetched here through the default proxy, each module checked against go.sum and sum.golang.org.
      - name: Download modules A
        run: go mod download && go mod verify
      - name: Build A (${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
        run: bash engineering/build/build.sh . /tmp/out-a "$(command -v go)" "$(go env GOMODCACHE)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-a-${{ matrix.arch }}
          path: |
            /tmp/out-a/impreza-s3-server
            /tmp/out-a/impreza-s3-server.sha256
            /tmp/out-a/impreza-s3-server.buildinfo.txt
            /tmp/out-a/build-params.txt
            /tmp/out-a/go-mod-verify.txt

  build-b:
    name: Build B linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # setup-go reads only the go directive, not the toolchain line; build.sh
      # pins GOTOOLCHAIN=local and refuses any other version, so the exact
      # toolchain is derived here from go.mod (setup-go wants the bare
      # version, without the go prefix) — still the single Go source.
      - name: Go toolchain from go.mod
        run: echo "GO_TOOLCHAIN=$(sed -n 's/^toolchain go//p' go.mod)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_TOOLCHAIN }}
      # build.sh is offline (GOPROXY=off) and needs the modules already in the cache; a fresh runner has none.
      # Fetched here through the default proxy, each module checked against go.sum and sum.golang.org.
      - name: Download modules B
        run: go mod download && go mod verify
      - name: Build B (${{ matrix.arch }})
        env:
          GOARCH: ${{ matrix.arch }}
        run: bash engineering/build/build.sh . /tmp/out-b "$(command -v go)" "$(go env GOMODCACHE)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-b-${{ matrix.arch }}
          path: |
            /tmp/out-b/impreza-s3-server
            /tmp/out-b/impreza-s3-server.sha256
            /tmp/out-b/impreza-s3-server.buildinfo.txt
            /tmp/out-b/build-params.txt
            /tmp/out-b/go-mod-verify.txt

  compare:
    name: Compare two builds linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [build-a, build-b]
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-a-${{ matrix.arch }}
          path: out-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-b-${{ matrix.arch }}
          path: out-b
      - name: Byte comparison
        run: bash engineering/build/compare.sh "$PWD/out-a" "$PWD/out-b"
      - name: SHA256SUMS artifact
        run: |
          cp out-a/impreza-s3-server "impreza-s3-server-linux-${{ matrix.arch }}"
          sha256sum "impreza-s3-server-linux-${{ matrix.arch }}" > SHA256SUMS
          cat out-a/build-params.txt >> SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS-${{ matrix.arch }}
          path: SHA256SUMS
