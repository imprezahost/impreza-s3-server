name: VulnCheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  # The release workflow (release.yml) runs this check before the draft.
  workflow_call:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Get official govulncheck v1.9.0
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        shell: bash
      - name: Run govulncheck
        run: govulncheck -db=https://vuln.go.dev -show verbose ./...
        shell: bash
