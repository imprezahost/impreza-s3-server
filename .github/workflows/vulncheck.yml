name: VulnCheck
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  # The release workflow (release.yml) runs this check before the draft.
  workflow_call:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  vulncheck:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Get official govulncheck v1.9.0
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOTOOLCHAIN: local
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        shell: bash
      - name: Run govulncheck
        run: govulncheck -db=https://vuln.go.dev -show verbose ./...
        shell: bash
