---
name: Spelling
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Check spelling of repo
      uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.51.1 (commit; the tag object is 9023c1f7)

