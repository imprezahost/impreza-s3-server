# Upstream (MinIO) typos configuration, restored exactly as the project kept
# it: the excluded paths, the ignored patterns, the words and the Go
# identifiers below are upstream's. The lines marked "fork" are this
# repository's own point exceptions, each with its reason.
[files]
extend-exclude = [".git/", "docs/", "CREDITS", "go.mod", "go.sum",
    # fork: the armored public key is base64, not prose; a chance word there
    # would push an edit to the published key bytes.
    "SECURITY-KEY.asc",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "Patrick Collison",
    "Copyright 2014 Unknwon",
    "[0-9A-Za-z/+=]{64}",
    "ZXJuZXQxDjAMBgNVBA-some-junk-Q4wDAYDVQQLEwVNaW5pbzEOMAwGA1UEAxMF",
    "eyJmb28iOiJiYXIifQ",
    "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.*",
    "MIIDBTCCAe2gAwIBAgIQWHw7h.*",
    'http\.Header\{"X-Amz-Server-Side-Encryptio":',
    "ZoEoZdLlzVbOlT9rbhD7ZN7TLyiYXSAlB79uGEge",
    "ERRO:",
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$", # ignore line
    # fork: gpg --with-colons tags the fingerprint record with a three-letter
    # format token (not a word) that engineering/ci/verify.cjs matches once, as
    # the start of a line followed by nine colons. Written with a class here so
    # this file does not spell it either.
    "\\^f[p]r:{9}",
]

[default.extend-words]
"encrypter" = "encrypter"
"kms" = "kms"
"requestor" = "requestor"
# fork: CNA, the CVE Numbering Authority, in SECURITY.md's CVE record link.
"cna" = "cna"

[default.extend-identifiers]
"HashiCorp" = "HashiCorp"
# fork: identifiers inherited from upstream benchmark/test and storage code.
"cpy" = "cpy"
"sterr" = "sterr"

[type.go.extend-identifiers]
"bui" = "bui"
"dm2nd" = "dm2nd"
"ot" = "ot"
"ParseND" = "ParseND"
"ParseNDStream" = "ParseNDStream"
"pn" = "pn"
"TestGetPartialObjectMisAligned" = "TestGetPartialObjectMisAligned"
"thr" = "thr"
"toi" = "toi"

[type.go]
extend-ignore-identifiers-re = [
    # Variants of `typ` used to mean `type` in golang as it is otherwise a
    # keyword - some of these (like typ1 -> type1) can be fixed, but probably
    # not worth the effort.
    "[tT]yp[0-9]*",
]
